name: Test Plan

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify all references to AI provider are Gemini
        run: |
          # Fails if 'claude' or 'anthropic' are found in source files (ignoring CLAUDE.md for now)
          ! grep -riE "claude|anthropic" --include="*.py" --include="*.md" --exclude="CLAUDE.md" .

      - name: Confirm setup instructions work end-to-end
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          .venv/bin/python3 -c "import schedule_agent; schedule_agent.tick()"
