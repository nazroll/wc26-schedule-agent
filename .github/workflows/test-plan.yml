name: Test Plan

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm setup instructions work end-to-end
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          .venv/bin/python3 -c "from schedule_agent import tick; from scraper import parse_schedule; print('OK')"
